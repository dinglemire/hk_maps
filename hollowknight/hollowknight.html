<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hollow Knight Interactive Map</title>
    
    <!-- Leaflet CSS (The library that handles the map logic) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>

    <style>
        /* Make the map full screen */
        body, html { margin: 0; padding: 0; height: 100%; background-color: #0c0c0c; }
        #map { width: 100%; height: 100vh; background: #0c0c0c; }
        
        /* Optional: Custom style for the Zoom controls to look more "Hollow Knight" */
        .leaflet-bar a { background-color: #2b2b2b; color: #d3d3d3; border-color: #444; }
        .leaflet-bar a:hover { background-color: #444; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>

    <script>
        // 1. SETUP THE MAP
        // L.CRS.Simple is used for flat maps (games), not Earth maps.
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 9,   // Matches your folder structure (0 to 9)
            zoomControl: false // We add it back manually to position it better if needed
        });

        // 2. DEFINE THE MAP BOUNDS
        // This prevents the user from dragging the map too far into the void.
        // We estimate size based on zoom level 9 (approx 256 * 2^9 pixels)
        const mapSize = 256 * Math.pow(2, 9); 
        const mapBounds = [[0, 0], [-mapSize, mapSize]]; // Leaflet uses negative Y for simple maps sometimes
        
        // 3. THE "GLUE" - TILE LAYER
        // This tells Leaflet where to find your 25,555 files.
        L.tileLayer('my_tiles/{z}/{x}/{y}.png', {
            tileSize: 256,
            noWrap: true,
            attribution: 'Team Cherry | Map by You',
            errorTileUrl: 'my_tiles/blank.png' // Use your blank.png if a tile is missing
        }).addTo(map);

        // 4. SET INITIAL VIEW
        // Centers the map roughly in the middle
        map.setView([-mapSize/2, mapSize/2], 2);

        // 5. ADD CONTROLS
        L.control.zoom({ position: 'topright' }).addTo(map);

        // 6. DEBUG MODE (Click to see coordinates for your future icons)
        map.on('click', function(e) {
            console.log("Map Clicked at:", e.latlng);
            L.popup()
                .setLatLng(e.latlng)
                .setContent("Coordinates: " + e.latlng.lat.toFixed(2) + ", " + e.latlng.lng.toFixed(2))
                .openOn(map);
        });

    </script>
</body>
</html>
