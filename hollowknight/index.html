<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hollow Knight Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #0c0c0c; overflow: hidden; }
        #map { width: 100%; height: 100%; background: #0c0c0c; }
        
        /* Debug Label styling */
        .tile-label {
            font-size: 14px;
            color: rgba(255, 255, 0, 0.7); /* Yellow text */
            border: 1px solid rgba(255, 255, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: monospace;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- The Map Container -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- YOUR SCRIPT -->
    <script src="script.js"></script>

</body>
</html>
