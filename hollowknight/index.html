<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hollow Knight Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="sidebar" id="sidebar">
        <!-- Toggle Arrow -->
        <div class="sidebar-toggle-btn" onclick="toggleSidebar()">❮</div>

        <div class="sidebar-header">
            <h2>Hallownest Map</h2>
        </div>
        
        <div class="sidebar-content">
            <input type="text" id="search-input" placeholder="Search locations...">
            
            <div class="slider-container">
                <div class="slider-label"><span>Icon Size</span> <span id="size-val">32px</span></div>
                <input type="range" id="icon-slider" min="16" max="64" value="32">
            </div>

            <div class="btn-group">
                <button class="btn" onclick="toggleAll(true)">Show All</button>
                <button class="btn" onclick="toggleAll(false)">Hide All</button>
            </div>

            <!-- List generated by JS -->
            <div id="category-list"></div>

            <hr style="border-color: #333">
            <button id="dev-btn" class="dev-toggle" onclick="toggleDevMode()">Enable Dev Mode</button>
            
            <div id="dev-panel" class="dev-panel">
                <small>1. Select Category<br>2. Click Map</small>
                <select id="dev-cat-select"></select>
                <textarea id="json-output" readonly placeholder="Data will appear here..."></textarea>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>

</body>
</html>
