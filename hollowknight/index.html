<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hollow Knight Interactive Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Hallownest Map</h2>
        </div>
        
        <div class="sidebar-content">
            <!-- Search -->
            <input type="text" id="search-input" placeholder="Search locations...">
            
            <!-- Size Slider -->
            <div class="slider-container">
                <div class="slider-label"><span>Icon Size</span> <span id="size-val">32px</span></div>
                <input type="range" id="icon-slider" min="16" max="64" value="32">
            </div>

            <!-- Toggle All -->
            <div class="btn-group">
                <button class="btn" onclick="toggleAll(true)">Show All</button>
                <button class="btn" onclick="toggleAll(false)">Hide All</button>
            </div>

            <!-- Categories Container -->
            <div id="category-list"></div>

            <!-- Dev Tools -->
             <hr style="border-color: #333">
            <button id="dev-btn" class="dev-toggle" onclick="toggleDevMode()">Enable Dev Mode</button>
            
            <div id="dev-panel" class="dev-panel">
                <small>1. Select Category<br>2. Click Map<br>3. Check Console</small>
                <select id="dev-cat-select"></select>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- 1. Load Data -->
    <script src="data.js"></script>
    
    <!-- 2. Load Application Logic -->
    <script src="script.js"></script>

</body>
</html>
