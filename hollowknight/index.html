<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hollow Knight Map</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* --- CORE STYLES --- */
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Cinzel', serif, sans-serif; }
        #map { width: 100%; height: 100%; background: #0c0c0c; }
        
        /* Hiding broken tiles in empty space */
        img.leaflet-tile { background: transparent !important; border: none !important; }

        /* --- SIDEBAR NAVIGATION --- */
        .sidebar {
            position: absolute; top: 10px; left: 10px; bottom: 10px;
            width: 300px;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid #444;
            border-radius: 4px;
            z-index: 2000;
            color: #ddd;
            display: flex; flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .sidebar-header {
            padding: 15px;
            border-bottom: 1px solid #333;
            background: #151515;
        }
        .sidebar-header h2 { margin: 0; font-size: 18px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        /* --- CONTROLS & INPUTS --- */
        input[type="text"] {
            width: 95%; padding: 8px; margin-bottom: 10px;
            background: #222; border: 1px solid #444; color: white;
            border-radius: 4px;
        }
        
        .slider-container { margin-bottom: 15px; padding: 0 5px; }
        .slider-label { font-size: 12px; color: #aaa; display: flex; justify-content: space-between; }
        input[type="range"] { width: 100%; accent-color: #fff; }

        .btn-group { display: flex; gap: 5px; margin-bottom: 15px; }
        .btn {
            flex: 1; padding: 6px; background: #333; color: #ccc;
            border: 1px solid #555; cursor: pointer; font-size: 12px;
        }
        .btn:hover { background: #444; color: #fff; }

        /* --- CATEGORY LIST --- */
        .cat-item {
            display: flex; align-items: center; padding: 8px 5px;
            border-bottom: 1px solid #222; cursor: pointer;
            transition: background 0.2s;
        }
        .cat-item:hover { background: #1a1a1a; }
        .cat-item input { margin-right: 10px; cursor: pointer; }
        .cat-icon { width: 24px; height: 24px; margin-right: 10px; object-fit: contain; }
        .cat-name { font-size: 14px; user-select: none; }

        /* --- DEV MODE --- */
        .dev-panel {
            margin-top: 20px; padding: 10px; border: 1px solid #d35400;
            background: rgba(50, 20, 0, 0.3); display: none;
        }
        .dev-panel.active { display: block; }
        .dev-toggle { width: 100%; background: #555; color: white; border:none; padding: 8px; cursor: pointer; margin-top: 10px;}
        .dev-toggle.on { background: #27ae60; }
        select { width: 100%; padding: 5px; background: #222; color: white; border: 1px solid #444; margin-top: 5px; }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <h2>Hallownest Map</h2>
        </div>
        
        <div class="sidebar-content">
            <!-- Search -->
            <input type="text" id="search-input" placeholder="Search locations...">
            
            <!-- Size Slider -->
            <div class="slider-container">
                <div class="slider-label"><span>Icon Size</span> <span id="size-val">32px</span></div>
                <input type="range" id="icon-slider" min="16" max="64" value="32">
            </div>

            <!-- Toggle All -->
            <div class="btn-group">
                <button class="btn" onclick="toggleAll(true)">Show All</button>
                <button class="btn" onclick="toggleAll(false)">Hide All</button>
            </div>

            <!-- Categories Container (Filled by JS) -->
            <div id="category-list"></div>

            <!-- Dev Tools -->
             <hr style="border-color: #333">
            <button id="dev-btn" class="dev-toggle" onclick="toggleDevMode()">Enable Dev Mode</button>
            
            <div id="dev-panel" class="dev-panel">
                <small>1. Select Category below<br>2. Click on Map</small>
                <select id="dev-cat-select"></select>
                <div style="font-size: 10px; color: #aaa; margin-top:5px;">JSON printed to Console (F12)</div>
            </div>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- LOAD SAVED DATA (Create this file later, for now it's empty array) -->
    <script>const savedPins = []; // Placeholder until you create data.js</script>
    <!-- If you have data.js, uncomment this: <script src="data.js"></script> -->

    <script>
        // --- 1. SETUP MAP (Your working logic) ---
        const TILE_SIZE = 256;
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 9,
            zoomControl: false,
            attributionControl: false
        });

        const HollowKnightLayer = L.TileLayer.extend({
            getTileUrl: function(coords) {
                if (coords.y < 0) return ""; 
                return `my_tiles/${coords.z}/${coords.y}/${coords.x}.png`; // The logic that worked for you
            }
        });

        new HollowKnightLayer('', {
            tileSize: TILE_SIZE,
            noWrap: true,
            bounds: [[-100000, -100000], [100000, 100000]],
            errorTileUrl: ''
        }).addTo(map);

        map.setView([-100, 100], 4);
        L.control.zoom({ position: 'topright' }).addTo(map);


        // --- 2. NAVIGATION & DATA CONFIG ---
        
        // Define Categories & Icons
        const categories = [
            { id: 'bench', name: 'Bench & Transport', icon: '23.png' },
            { id: 'shortcuts', name: 'Shortcuts', icon: '50.png' },
            { id: 'upgrades', name: 'Upgrades', icon: '29.png' },
            { id: 'charms', name: 'Charms', icon: '44.png' },
            { id: 'bosses', name: 'Bosses', icon: '35.png' },
            { id: 'npcs', name: 'Npcs', icon: '10.png' },
            { id: 'grubs', name: 'Grubs', icon: '27.png' },
            { id: 'misc', name: 'Map Misc.', icon: '14.png' },
            { id: 'items', name: 'Items', icon: '45.png' },
            { id: 'geo', name: 'Geo & Soul Totems', icon: '4.png' }
        ];

        // Storage for LayerGroups (to show/hide)
        const layers = {};
        const allMarkers = []; // To keep track for searching/resizing
        let currentIconSize = 32;
        let isDevMode = false;

        // --- 3. INITIALIZATION ---

        function init() {
            const listContainer = document.getElementById('category-list');
            const devSelect = document.getElementById('dev-cat-select');

            categories.forEach(cat => {
                // 1. Create Layer Group
                layers[cat.id] = L.layerGroup().addTo(map);

                // 2. Build Sidebar HTML
                const item = document.createElement('div');
                item.className = 'cat-item';
                item.innerHTML = `
                    <input type="checkbox" checked onchange="toggleLayer('${cat.id}', this.checked)">
                    <img src="icons/${cat.icon}" class="cat-icon">
                    <span class="cat-name">${cat.name}</span>
                `;
                listContainer.appendChild(item);

                // 3. Build Dev Dropdown
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.innerText = cat.name;
                devSelect.appendChild(opt);
            });

            // Load existing data (if any)
            loadPinsFromData();
        }

        // --- 4. CORE FUNCTIONS ---

        function createMarker(lat, lng, catId, iconId, title) {
            // Create Icon
            const hkIcon = L.icon({
                iconUrl: `icons/${iconId}.png`,
                iconSize: [currentIconSize, currentIconSize],
                popupAnchor: [0, -currentIconSize/2],
                className: 'hk-marker' // Helper class for resizing
            });

            const marker = L.marker([lat, lng], {icon: hkIcon, title: title}); // Title for search
            
            // Add Popup
            marker.bindPopup(`<b>${title}</b><br><small>${categories.find(c=>c.id===catId).name}</small>`);
            
            // Add to LayerGroup
            if(layers[catId]) {
                layers[catId].addLayer(marker);
            }

            // Store reference
            allMarkers.push({ marker: marker, catId: catId });
        }

        function loadPinsFromData() {
            if(typeof savedPins === 'undefined') return;
            savedPins.forEach(p => {
                createMarker(p.lat, p.lng, p.cat, p.icon, p.title);
            });
        }

        // --- 5. INTERACTION LOGIC ---

        // Show/Hide Categories
        window.toggleLayer = function(id, show) {
            if(show) {
                map.addLayer(layers[id]);
            } else {
                map.removeLayer(layers[id]);
            }
            filterSearch(); // Re-apply search filter just in case
        }

        window.toggleAll = function(show) {
            const checkboxes = document.querySelectorAll('.cat-item input');
            checkboxes.forEach(cb => {
                cb.checked = show;
                // Trigger the change event manually or just call the function
                const catId = categories.find(c => c.name === cb.nextElementSibling.nextElementSibling.innerText).id;
                toggleLayer(catId, show);
            });
        }

        // Resize Icons
        const slider = document.getElementById('icon-slider');
        slider.oninput = function() {
            currentIconSize = parseInt(this.value);
            document.getElementById('size-val').innerText = currentIconSize + 'px';
            
            allMarkers.forEach(item => {
                const icon = item.marker.options.icon;
                icon.options.iconSize = [currentIconSize, currentIconSize];
                icon.options.popupAnchor = [0, -currentIconSize/2];
                item.marker.setIcon(icon);
            });
        };

        // Search Function
        const searchInput = document.getElementById('search-input');
        searchInput.addEventListener('input', filterSearch);

        function filterSearch() {
            const text = searchInput.value.toLowerCase();
            
            allMarkers.forEach(item => {
                const layerGroup = layers[item.catId];
                const matchesSearch = item.marker.options.title.toLowerCase().includes(text);
                
                // If map has this layer enabled
                if (map.hasLayer(layerGroup)) {
                    if (matchesSearch) {
                        // Ensure marker is visible
                        if (!layerGroup.hasLayer(item.marker)) {
                            layerGroup.addLayer(item.marker);
                        }
                    } else {
                        // Remove non-matching marker temporarily
                        layerGroup.removeLayer(item.marker);
                    }
                }
            });
        }

        // --- 6. DEV MODE LOGIC ---

        window.toggleDevMode = function() {
            isDevMode = !isDevMode;
            const btn = document.getElementById('dev-btn');
            const panel = document.getElementById('dev-panel');
            
            if(isDevMode) {
                btn.classList.add('on');
                btn.innerText = "Dev Mode: ACTIVE";
                panel.classList.add('active');
                map.getContainer().style.cursor = "crosshair";
            } else {
                btn.classList.remove('on');
                btn.innerText = "Enable Dev Mode";
                panel.classList.remove('active');
                map.getContainer().style.cursor = "";
            }
        }

        map.on('click', function(e) {
            if (!isDevMode) return;

            const catId = document.getElementById('dev-cat-select').value;
            const lat = e.latlng.lat.toFixed(0);
            const lng = e.latlng.lng.toFixed(0);

            // 1. Prompt Title
            const title = prompt("Enter Pin Title (e.g. 'Dirtmouth Stag'):");
            if(!title) return;

            // 2. Prompt Icon ID
            const iconId = prompt("Enter Icon Number (e.g. '23'):", "1");
            if(!iconId) return;

            // 3. Create it visually immediately
            createMarker(lat, lng, catId, iconId, title);

            // 4. Log Data
            const json = `{ "lat": ${lat}, "lng": ${lng}, "cat": "${catId}", "icon": "${iconId}", "title": "${title}" },`;
            console.log("%c PIN CREATED: ", "background: #222; color: #bada55", json);
        });

        // Start everything
        init();

    </script>
</body>
</html>
