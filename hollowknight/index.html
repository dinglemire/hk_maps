<!DOCTYPE html>
<html>
<head>
    <title>Hollow Knight Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #000; }
        #map { width: 100vw; height: 100vh; background: #000; }
        
        /* Debug Grid: shows red outline around tiles */
        .leaflet-tile { border: 1px solid rgba(255, 0, 0, 0.2); }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- CONFIGURATION ---
        const TILE_SIZE = 256;
        // Based on your file list, your map content is centered here at Zoom 9:
        // X files exist from ~10 to ~200. Center ~100.
        // Y files exist from ~20 to ~250. Center ~140.
        const CENTER_TILE_X = 100;
        const CENTER_TILE_Y = 140;
        
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 9,
            zoomControl: false
        });

        L.tileLayer('my_tiles/{z}/{x}/{y}.png', {
            tileSize: TILE_SIZE,
            noWrap: true,
            bounds: [[-100000, -100000], [100000, 100000]], // Allow dragging anywhere
            errorTileUrl: '', // Don't show broken image icons for missing tiles
            attribution: 'Hollow Knight'
        }).addTo(map);

        // --- SET VIEW TO THE CONTENT ---
        // Leaflet Simple CRS: [0,0] is top left. Y goes negative.
        // We calculate the pixel coordinates of your center tile at Zoom 9.
        const centerX = CENTER_TILE_X * TILE_SIZE;
        const centerY = -1 * CENTER_TILE_Y * TILE_SIZE; // Negative because CRS.Simple goes down

        map.setView([centerY, centerX], 9); // Start at Zoom 9 to ensure you see the files we know exist
        
        L.control.zoom({ position: 'topright' }).addTo(map);

        // --- DEBUG HELPER ---
        // This popup tells you where you are, so you can find your map if lost
        map.on('click', function(e) {
            const z = map.getZoom();
            // Calculate which tile folder this click corresponds to
            const tileX = Math.floor(e.latlng.lng / TILE_SIZE);
            const tileY = Math.floor(-e.latlng.lat / TILE_SIZE);
            
            L.popup()
                .setLatLng(e.latlng)
                .setContent(`
                    <strong>You are at:</strong><br>
                    Zoom: ${z}<br>
                    Tile X: ${tileX}<br>
                    Tile Y: ${tileY}<br>
                    <br>
                    <em>Look in your my_tiles/${z}/${tileX} folder to see if a file exists here!</em>
                `)
                .openOn(map);
        });
    </script>
</body>
</html>
