<!DOCTYPE html>
<html>
<head>
    <title>Hollow Knight Map Final</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; background: #0c0c0c; }
        .msg-box {
            position: absolute; top: 10px; left: 50px; z-index: 1000;
            background: rgba(0,0,0,0.8); color: #0f0; padding: 10px;
            border: 1px solid #0f0; max-width: 300px;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="msg-box">
        <strong>Status:</strong><br>
        <span id="status">Locating map...</span><br>
        <hr>
        If you see a BLUE BOX, your map is inside it.<br>
        If the box is empty, the image paths are wrong.
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- CONFIGURATION ---
        // Based on your file list:
        // Zoom 9 has X up to ~150, Y up to ~280
        const TILE_SIZE = 256;
        const MAX_WIDTH = 150 * TILE_SIZE;
        const MAX_HEIGHT = 280 * TILE_SIZE;

        const map = L.map('map', {
            crs: L.CRS.Simple, // Flat coordinates
            minZoom: 0,
            maxZoom: 9,
            zoomControl: false
        });

        // 1. Define the Map Bounds (The Blue Box)
        // In Simple CRS, Y goes negative (Down).
        // TopLeft: [0,0], BottomRight: [-Height, Width]
        const mapBounds = [[0, 0], [-MAX_HEIGHT, MAX_WIDTH]];

        // 2. Add the Image Tiles
        const layer = L.tileLayer('my_tiles/{z}/{x}/{y}.png', {
            tileSize: TILE_SIZE,
            bounds: mapBounds, // Only load tiles inside the box
            noWrap: true,
            tms: false, // Try changing to true if images appear but are scrambled
            errorTileUrl: '' // Keep empty to see background
        }).addTo(map);

        // 3. Add the Blue Reference Box (So you can't get lost)
        L.rectangle(mapBounds, {color: "#0074D9", weight: 2, fill: false}).addTo(map);

        // 4. Force Camera to Center of the Box
        map.fitBounds(mapBounds);
        
        // 5. Add Zoom Controls
        L.control.zoom({ position: 'topright' }).addTo(map);

        // 6. Debugging Events
        layer.on('tileload', () => {
            document.getElementById('status').innerHTML = "✅ Tiles are loading!";
            document.getElementById('status').style.color = "#0f0";
        });
        
        layer.on('tileerror', (e) => {
            // Grab the path it tried to load
            const path = e.url.split('hollowknight/')[1] || e.url;
            document.getElementById('status').innerHTML = `❌ 404 Error.<br>Tried: ${path}`;
            document.getElementById('status').style.color = "red";
        });

        // 7. Coordinate clicker
        map.on('click', function(e) {
             L.popup()
                .setLatLng(e.latlng)
                .setContent(`XY: ${e.latlng.lng.toFixed(0)}, ${e.latlng.lat.toFixed(0)}`)
                .openOn(map);
        });

    </script>
</body>
</html>
