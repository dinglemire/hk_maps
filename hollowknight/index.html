<!DOCTYPE html>
<html>
<head>
    <title>Hollow Knight Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #000; }
        #map { width: 100vw; height: 100vh; background: #0c0c0c; }
        .controls {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: rgba(0,0,0,0.8); padding: 10px; border: 1px solid #444; color: white;
        }
        button { cursor: pointer; padding: 5px 10px; background: #0074D9; color: white; border: none; font-size: 14px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="controls">
        <button onclick="toggleFix()">🧩 Fix Scramble (Toggle Mode)</button>
        <div id="mode-display" style="margin-top:5px; font-size:12px;">Current: Standard</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- CONFIG ---
        const TILE_SIZE = 256;
        
        // 1. SETUP MAP
        // We use a standard "Simple" projection for game maps
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 9,
            zoomControl: false,
            attributionControl: false
        });

        // 2. TILE LOGIC
        // We need a custom way to fetch tiles because Leaflet expects negative Y, 
        // but your files are likely positive Y.
        let useTMS = false; // Toggle this if tiles are scrambled

        const CustomLayer = L.TileLayer.extend({
            getTileUrl: function(coords) {
                let z = coords.z;
                let x = coords.x;
                let y = coords.y;

                // Leaflet uses negative Y for Simple CRS. We need positive for files.
                // We check if we need to invert it (Standard) or flip it (TMS)
                if (useTMS) {
                    // "Bottom-Up" numbering
                    y = (Math.pow(2, z) - 1) - y;
                } else {
                    // "Top-Down" numbering (Standard)
                    y = Math.abs(y);
                }

                return `my_tiles/${z}/${x}/${y}.png`;
            }
        });

        let layer = new CustomLayer('', {
            tileSize: TILE_SIZE,
            noWrap: true,
            bounds: [[-100000, -100000], [100000, 100000]] // Allow scrolling everywhere
        }).addTo(map);

        // 3. CENTER THE VIEW
        // 0/0/0.png covers the area from [0,0] to [-256, 256].
        // We center right in the middle of that first tile.
        map.setView([-128, 128], 2); 

        // 4. CONTROLS
        L.control.zoom({ position: 'topleft' }).addTo(map);

        // 5. FIX BUTTON LOGIC
        function toggleFix() {
            useTMS = !useTMS; // Flip mode
            
            document.getElementById('mode-display').innerText = 
                useTMS ? "Current: TMS (Bottom-Up)" : "Current: Standard (Top-Down)";
            
            layer.redraw(); // Reload images
        }

    </script>
</body>
</html>
