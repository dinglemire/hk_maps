<!DOCTYPE html>
<html>
<head>
    <title>Hollow Knight Map Fixer</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; background: #101010; }
        
        /* Fixer Panel Styling */
        .fixer-panel {
            background: rgba(30, 30, 30, 0.9);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            color: white;
            width: 250px;
        }
        .fixer-panel h3 { margin: 0 0 10px 0; font-size: 16px; color: #f1c40f; }
        .fixer-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
            background: #444;
            border: 1px solid #555;
            color: white;
            cursor: pointer;
            border-radius: 4px;
            text-align: left;
        }
        .fixer-btn:hover { background: #666; }
        .fixer-btn.active { background: #2ecc71; border-color: #27ae60; color: #fff; }
        .status-text { font-size: 12px; color: #aaa; margin-top: 5px; }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- CONFIGURATION ---
        const MAX_ZOOM = 9;
        const TILE_SIZE = 256;
        
        // CENTER CALCULATION (Based on your provided file list)
        // Zoom 9 center roughly at X=60, Y=150
        const START_X = 60 * TILE_SIZE;
        const START_Y = -150 * TILE_SIZE;

        // --- STATE VARIABLES ---
        // These change how we request the image files
        let state = {
            invertY: true,    // Flip Y axis (Standard for Leaflet vs FileSystem)
            tms: false,       // Tile Map Service standard
            offsetX: 0,       // Shift columns
            offsetY: 0        // Shift rows
        };

        // 1. SETUP MAP
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: MAX_ZOOM,
            zoomControl: false,
            center: [START_Y, START_X], // Focusing on the content
            zoom: 6 // Start zoomed out slightly so you can see the pattern
        });

        // 2. CUSTOM LAYER
        // This creates the URL for every tile
        const CustomLayer = L.TileLayer.extend({
            getTileUrl: function(coords) {
                let x = coords.x + state.offsetX;
                let y = coords.y + state.offsetY;
                let z = coords.z;

                // --- THE FIXER LOGIC ---
                
                // Handle Y Axis flipping
                if (state.invertY) {
                    y = -y - 1; // Leaflet uses negative Y, Files use positive Y
                }

                // Handle TMS (Bottom-to-top)
                if (state.tms) {
                    y = (Math.pow(2, z) - 1) - y;
                }

                return `my_tiles/${z}/${x}/${y}.png`;
            }
        });

        let tileLayer = new CustomLayer('', { 
            tileSize: TILE_SIZE,
            noWrap: true,
            bounds: [[-100000, -100000], [100000, 100000]]
        }).addTo(map);

        // 3. DEBUG CONTROLS
        L.control.zoom({ position: 'topright' }).addTo(map);

        const FixerControl = L.Control.extend({
            onAdd: function() {
                const div = L.DomUtil.create('div', 'fixer-panel leaflet-bar');
                div.innerHTML = `
                    <h3>🧩 Map Puzzle Fixer</h3>
                    
                    <button class="fixer-btn active" id="btn-invert" onclick="toggleInvert()">
                        ↕️ Invert Y-Axis (On)
                    </button>
                    
                    <button class="fixer-btn" id="btn-tms" onclick="toggleTMS()">
                        🔄 TMS Mode (Off)
                    </button>
                    
                    <div style="display:flex; gap:5px;">
                        <button class="fixer-btn" onclick="shift(0, -1)">⬆️</button>
                        <button class="fixer-btn" onclick="shift(0, 1)">⬇️</button>
                    </div>
                     <div class="status-text">Shift Y (Row): <span id="val-y">0</span></div>

                    <div style="display:flex; gap:5px;">
                        <button class="fixer-btn" onclick="shift(-1, 0)">⬅️</button>
                        <button class="fixer-btn" onclick="shift(1, 0)">➡️</button>
                    </div>
                    <div class="status-text">Shift X (Col): <span id="val-x">0</span></div>

                    <hr style="border:0; border-top:1px solid #555;">
                    <div class="status-text" id="url-debug">Hover map...</div>
                `;
                return div;
            }
        });
        new FixerControl({ position: 'topright' }).addTo(map);

        // --- ACTIONS ---
        
        function updateLayer() {
            tileLayer.redraw();
            updateUI();
        }

        function toggleInvert() {
            state.invertY = !state.invertY;
            updateLayer();
        }

        function toggleTMS() {
            state.tms = !state.tms;
            updateLayer();
        }

        function shift(dx, dy) {
            state.offsetX += dx;
            state.offsetY += dy;
            updateLayer();
        }

        function updateUI() {
            document.getElementById('btn-invert').className = state.invertY ? 'fixer-btn active' : 'fixer-btn';
            document.getElementById('btn-invert').innerText = state.invertY ? '↕️ Invert Y (On)' : '↕️ Invert Y (Off)';
            
            document.getElementById('btn-tms').className = state.tms ? 'fixer-btn active' : 'fixer-btn';
            document.getElementById('btn-tms').innerText = state.tms ? '🔄 TMS Mode (On)' : '🔄 TMS Mode (Off)';

            document.getElementById('val-x').innerText = state.offsetX;
            document.getElementById('val-y').innerText = state.offsetY;
        }

        // Debug text
        map.on('mousemove', function(e) {
            const z = map.getZoom();
            let x = Math.floor(e.latlng.lng / TILE_SIZE);
            let y = Math.floor(-e.latlng.lat / TILE_SIZE); // Leaflet native
            
            // Calculate what the script is actually requesting
            let reqX = x + state.offsetX;
            let reqY = y + state.offsetY;
            if(state.invertY) reqY = -reqY - 1;
            if(state.tms) reqY = (Math.pow(2, z) - 1) - reqY;

            document.getElementById('url-debug').innerText = 
                `Req: my_tiles/${z}/${reqX}/${reqY}.png`;
        });

    </script>
</body>
</html>
