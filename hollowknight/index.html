<!DOCTYPE html>
<html>
<head>
    <title>HK Map Final Fix</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; background: #0c0c0c; }
        
        .controls {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: rgba(0,0,0,0.9); padding: 15px; width: 200px;
            border: 1px solid #555; color: white; border-radius: 5px;
        }
        button {
            display: block; width: 100%; padding: 10px; margin-bottom: 5px;
            background: #333; color: #fff; border: 1px solid #666; cursor: pointer;
        }
        button:hover { background: #555; }
        button.active { background: #28a745; border-color: #28a745; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="controls">
        <strong>🔧 Configuration</strong><hr>
        <button onclick="toggle('swap')" id="btn-swap">🔀 Swap X/Y Folders</button>
        <button onclick="toggle('invert')" id="btn-inv">↕️ Invert Y Axis</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const TILE_SIZE = 256;
        
        // STATE
        let state = {
            swapXY: false, // Check if folders are Z/Y/X instead of Z/X/Y
            invertY: false // Check if Y needs flipping
        };

        // SETUP MAP
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 9,
            zoomControl: false
        });

        // CUSTOM LAYER
        const Layer = L.TileLayer.extend({
            getTileUrl: function(coords) {
                let z = coords.z;
                let x = coords.x;
                let y = coords.y;
                
                // 1. Handle Inversion (Leaflet is negative Y by default)
                // We start by making it positive absolute
                let finalY = Math.abs(y);
                
                // If "Invert" is active, we flip the counting direction
                // (assuming typical TMS style relative to zoom)
                if (state.invertY) {
                    finalY = (Math.pow(2, z) - 1) - finalY;
                }

                // 2. Handle Folder Structure
                if (state.swapXY) {
                    // Use Y for the folder, X for the file
                    return `my_tiles/${z}/${finalY}/${x}.png`;
                } else {
                    // Standard: Use X for the folder, Y for the file
                    return `my_tiles/${z}/${x}/${finalY}.png`;
                }
            }
        });

        let tileLayer = new Layer('', {
            tileSize: TILE_SIZE,
            noWrap: true,
            bounds: [[-100000, -100000], [100000, 100000]],
            errorTileUrl: '' 
        }).addTo(map);

        // VIEW
        map.setView([-100, 100], 4); // Start zoomed out to see the pattern
        L.control.zoom({ position: 'topleft' }).addTo(map);

        // LOGIC
        function toggle(mode) {
            if(mode === 'swap') state.swapXY = !state.swapXY;
            if(mode === 'invert') state.invertY = !state.invertY;
            
            // Update Buttons
            document.getElementById('btn-swap').className = state.swapXY ? 'active' : '';
            document.getElementById('btn-inv').className = state.invertY ? 'active' : '';
            
            tileLayer.redraw();
        }
    </script>
</body>
</html>
