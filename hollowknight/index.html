<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hollow Knight Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" 
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" 
          crossorigin=""/>

    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; }
        #map { width: 100%; height: 100%; background: #0c0c0c; }
        
        /* Custom Map Controls styling */
        .leaflet-bar a { background-color: #222; color: #fff; border-bottom: 1px solid #444; }
        .leaflet-bar a:hover { background-color: #444; }
        .coord-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 10px;
            color: #aaa;
            font-family: monospace;
            border-radius: 4px;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" 
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" 
            crossorigin=""></script>

    <script>
        // --- MAP CONFIGURATION ---
        const MIN_ZOOM = 0;
        const MAX_ZOOM = 9;
        const TILE_SIZE = 256;

        // Calculated based on your files (X: ~100 tiles, Y: ~150 tiles at Zoom 9)
        // In Leaflet Simple CRS, Y is negative.
        const CENTER_X = 100 * TILE_SIZE; 
        const CENTER_Y = -150 * TILE_SIZE; 

        // 1. INITIALIZE MAP
        const map = L.map('map', {
            crs: L.CRS.Simple,       // "Flat" coordinate system for game maps
            minZoom: MIN_ZOOM,
            maxZoom: MAX_ZOOM,
            zoomControl: false,      // We will add a custom one
            attributionControl: false
        });

        // 2. ADD TILES
        L.tileLayer('my_tiles/{z}/{x}/{y}.png', {
            tileSize: TILE_SIZE,
            noWrap: true,
            minZoom: MIN_ZOOM,
            maxZoom: MAX_ZOOM,
            errorTileUrl: 'my_tiles/blank.png', // Load this if a tile is missing/black
            tms: false // Your files are Top-to-Bottom (Standard), so this is false.
        }).addTo(map);

        // 3. SET VIEW TO CENTER
        // We point the camera at the calculated center of your tiles
        map.setView([CENTER_Y, CENTER_X], 2);

        // 4. CONTROLS
        L.control.zoom({ position: 'topright' }).addTo(map);

        // 5. DEBUG TOOL (COORDINATE FINDER)
        // Shows coordinates in the bottom left when you move the mouse
        const CoordControl = L.Control.extend({
            onAdd: map => {
                const div = L.DomUtil.create('div', 'coord-box');
                div.id = 'coords';
                div.innerHTML = "Move mouse...";
                return div;
            }
        });
        new CoordControl({ position: 'bottomleft' }).addTo(map);

        map.on('mousemove', e => {
            const x = Math.round(e.latlng.lng);
            const y = Math.round(e.latlng.lat);
            document.getElementById('coords').innerHTML = `X: ${x} | Y: ${y}`;
        });

        // Click to create a popup (Useful for placing markers later)
        map.on('click', e => {
            console.log(`Location: [${e.latlng.lat}, ${e.latlng.lng}]`);
            L.popup()
                .setLatLng(e.latlng)
                .setContent(`Pos: [${e.latlng.lat.toFixed(0)}, ${e.latlng.lng.toFixed(0)}]`)
                .openOn(map);
        });

    </script>
</body>
</html>
