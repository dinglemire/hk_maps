<!DOCTYPE html>
<html>
<head>
    <title>HK Puzzle Solver</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #000; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; background: #0c0c0c; }
        
        /* CONTROL PANEL */
        .solver-panel {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: rgba(20, 20, 20, 0.9); padding: 15px;
            color: white; border: 1px solid #444; width: 220px;
            border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .solver-panel h3 { margin: 0 0 10px 0; color: #FFD700; text-align: center; }
        .btn-row { display: flex; justify-content: space-between; margin-bottom: 5px; }
        button {
            background: #444; color: white; border: 1px solid #666;
            padding: 8px; cursor: pointer; width: 48%; font-weight: bold;
        }
        button:hover { background: #666; }
        button.active { background: #28a745; border-color: #28a745; }
        .readout { font-family: monospace; text-align: center; color: #aaa; margin-top: 10px; font-size: 12px;}
        .highlight { color: #0f0; font-weight: bold; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="solver-panel">
        <h3>🧩 Puzzle Solver</h3>
        
        <div style="text-align:center; margin-bottom:5px;">Vertical Shift (Y)</div>
        <div class="btn-row">
            <button onclick="shift(0, -1)">⬆️ Up</button>
            <button onclick="shift(0, 1)">⬇️ Down</button>
        </div>

        <div style="text-align:center; margin-bottom:5px;">Horizontal Shift (X)</div>
        <div class="btn-row">
            <button onclick="shift(-1, 0)">⬅️ Left</button>
            <button onclick="shift(1, 0)">➡️ Right</button>
        </div>

        <hr style="border-color:#444">
        
        <button onclick="toggleInv()" id="btn-inv" style="width:100%">🔄 Flip Y-Axis</button>
        
        <div class="readout">
            Offset X: <span id="val-x" class="highlight">0</span><br>
            Offset Y: <span id="val-y" class="highlight">0</span>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- SETTINGS ---
        const TILE_SIZE = 256;
        
        // --- STATE ---
        let shiftX = 0;
        let shiftY = 0;
        let invertY = false; // Tries to fix upside-down maps

        // 1. SETUP MAP
        const map = L.map('map', {
            crs: L.CRS.Simple, // Flat world
            minZoom: 0,
            maxZoom: 9,
            zoomControl: false
        });

        // 2. CUSTOM LAYER
        const PuzzleLayer = L.TileLayer.extend({
            getTileUrl: function(coords) {
                let z = coords.z;
                
                // Apply Shifting
                let x = coords.x + shiftX;
                let y = coords.y + shiftY;

                // Handle Leaflet's Negative Y (Standard behavior for Simple CRS)
                // If Leaflet wants Y = -5 (5 tiles down), we convert to positive 5.
                let finalY = invertY ? (-y - 1) : Math.abs(y);

                return `my_tiles/${z}/${x}/${finalY}.png`;
            }
        });

        let layer = new PuzzleLayer('', {
            tileSize: TILE_SIZE,
            noWrap: true,
            bounds: [[-100000, -100000], [100000, 100000]],
            errorTileUrl: '' // Hide broken tiles so they don't distract
        }).addTo(map);

        // 3. VIEW
        map.setView([-100, 100], 2);
        L.control.zoom({ position: 'topleft' }).addTo(map);

        // 4. LOGIC
        function shift(x, y) {
            shiftX += x;
            shiftY += y;
            updateUI();
        }

        function toggleInv() {
            invertY = !invertY;
            document.getElementById('btn-inv').className = invertY ? 'active' : '';
            updateUI();
        }

        function updateUI() {
            document.getElementById('val-x').innerText = shiftX;
            document.getElementById('val-y').innerText = shiftY;
            layer.redraw(); // Force map refresh
        }

        // Debug click
        map.on('click', e => {
            console.log("Clicked", e.latlng);
        });

    </script>
</body>
</html>
