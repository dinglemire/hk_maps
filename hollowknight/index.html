<!DOCTYPE html>
<html>
<head>
    <title>Hollow Knight Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #0c0c0c; font-family: sans-serif; }
        #map { width: 100vw; height: 100vh; background: #0c0c0c; }
        
        .controls {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: rgba(0,0,0,0.9); padding: 15px; width: 200px;
            border: 1px solid #555; color: white; border-radius: 5px;
        }
        button {
            display: block; width: 100%; padding: 10px; margin-bottom: 5px;
            background: #333; color: #fff; border: 1px solid #666; cursor: pointer;
        }
        button:hover { background: #555; }
        button.active { background: #28a745; border-color: #28a745; }
    </style>
</head>
<body>

    <div id="map"></div>
    
    <div class="controls">
        <strong>🔧 Configuration</strong><hr>
        <button onclick="toggle('swap')" id="btn-swap" class="active">🔀 Swap X/Y (On)</button>
        <button onclick="toggle('invert')" id="btn-inv">↕️ Invert Y Axis</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const TILE_SIZE = 256;
        
        // STATE
        // We default SwapXY to true because you confirmed it connects the images correctly.
        let state = {
            swapXY: true, 
            invertY: false 
        };

        // SETUP MAP
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 9,
            zoomControl: false
        });

        // CUSTOM LAYER
        const Layer = L.TileLayer.extend({
            getTileUrl: function(coords) {
                let z = coords.z;
                let x = coords.x;
                let y = coords.y;
                
                // 1. STOP MIRRORING (The Fix)
                // If y is negative (scrolling up above the map), don't load anything.
                if (y < 0) return ""; 
                
                // 2. Handle Inversion (Optional toggle)
                if (state.invertY) {
                    y = (Math.pow(2, z) - 1) - y;
                }

                // 3. Handle Folder Swapping (The logic that fixed your puzzle)
                // Note: vips/deepzoom often saves as 'column/row' (x/y) but sometimes 'row/column' (y/x)
                if (state.swapXY) {
                    // Use Y for the folder, X for the file
                    return `my_tiles/${z}/${y}/${x}.png`;
                } else {
                    // Standard: Use X for the folder, Y for the file
                    return `my_tiles/${z}/${x}/${y}.png`;
                }
            }
        });

        let tileLayer = new Layer('', {
            tileSize: TILE_SIZE,
            noWrap: true,
            bounds: [[-100000, -100000], [100000, 100000]],
            errorTileUrl: '' 
        }).addTo(map);

        // VIEW
        map.setView([-100, 100], 4);
        L.control.zoom({ position: 'topleft' }).addTo(map);

        // LOGIC
        function toggle(mode) {
            if(mode === 'swap') state.swapXY = !state.swapXY;
            if(mode === 'invert') state.invertY = !state.invertY;
            
            // Update Button Visuals
            const btnSwap = document.getElementById('btn-swap');
            const btnInv = document.getElementById('btn-inv');
            
            btnSwap.className = state.swapXY ? 'active' : '';
            btnSwap.innerText = state.swapXY ? '🔀 Swap X/Y (On)' : '🔀 Swap X/Y (Off)';
            
            btnInv.className = state.invertY ? 'active' : '';
            btnInv.innerText = state.invertY ? '↕️ Invert Y (On)' : '↕️ Invert Y (Off)';

            tileLayer.redraw();
        }
    </script>
</body>
</html>
