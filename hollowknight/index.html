<!DOCTYPE html>
<html>
<head>
    <title>Hollow Knight Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* 1. Set the whole page background to black */
        body { margin: 0; background: #000; overflow: hidden; }
        
        /* 2. Ensure the map container is black to hide "grey squares" in empty space */
        #map { width: 100vw; height: 100vh; background: #000; }

        /* 3. Hide "broken image" borders if the browser tries to load a tile that doesn't exist */
        img.leaflet-tile { 
            background: transparent !important; 
            border: none !important;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // --- CONFIGURATION ---
        const TILE_SIZE = 256;
        
        // 1. SETUP MAP
        const map = L.map('map', {
            crs: L.CRS.Simple, // Flat coordinates for games
            minZoom: 0,
            maxZoom: 9,
            zoomControl: false, // We add it back in a specific spot
            attributionControl: false
        });

        // 2. CUSTOM TILE LAYER
        // This contains the logic that fixed your map (Swap X/Y enabled)
        const HollowKnightLayer = L.TileLayer.extend({
            getTileUrl: function(coords) {
                let z = coords.z;
                let x = coords.x;
                let y = coords.y;
                
                // PREVENT MIRRORING:
                // If y is negative (scrolling up past the top), don't load anything.
                if (y < 0) return ""; 
                
                // SWAP LOGIC (Hardcoded ON):
                // Your map generator saved folders as Z / Row / Col
                // So we put 'y' in the folder spot, and 'x' in the file spot.
                return `my_tiles/${z}/${y}/${x}.png`;
            }
        });

        // Add the layer to the map
        new HollowKnightLayer('', {
            tileSize: TILE_SIZE,
            noWrap: true,
            bounds: [[-100000, -100000], [100000, 100000]], // Allow scrolling far
            errorTileUrl: '' // If a tile is missing, show nothing (transparent)
        }).addTo(map);

        // 3. VIEW SETTINGS
        // Center roughly in the middle of the content
        map.setView([-100, 100], 4); 

        // 4. CONTROLS
        L.control.zoom({ position: 'topright' }).addTo(map);

        // 5. CLICK LISTENER (For adding markers later)
        // This prints coordinates to the Console (F12) when you click, 
        // so you can find locations for your icons easily.
        map.on('click', function(e) {
            console.log("Coordinates:", e.latlng.lng.toFixed(0), e.latlng.lat.toFixed(0));
        });

    </script>
</body>
</html>
