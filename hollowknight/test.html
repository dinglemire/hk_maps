<!DOCTYPE html>
<html>
<head>
    <style>
        body { background: #111; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        img { border: 2px solid yellow; margin: 10px; }
        .success { color: #0f0; }
        .fail { color: #f00; }
    </style>
</head>
<body>
    <h2>🕵️ Path Detective</h2>
    <p>We are testing if the browser can see your files.</p>

    <!-- TEST 1: ZOOM 0 (The whole world) -->
    <div>
        <h3>Test 1: Zoom 0 (0/0/0.png)</h3>
        <img src="my_tiles/0/0/0.png" width="100" height="100" 
             onload="log('Test 1', true)" 
             onerror="log('Test 1', false)">
        <div id="res-1">Waiting...</div>
    </div>

    <!-- TEST 2: ZOOM 9 (A specific tile we saw in your list) -->
    <div>
        <h3>Test 2: Zoom 9 (9/10/108.png)</h3>
        <img src="my_tiles/9/10/108.png" width="100" height="100" 
             onload="log('Test 2', true)" 
             onerror="log('Test 2', false)">
        <div id="res-2">Waiting...</div>
    </div>

    <script>
        function log(name, success) {
            const id = name === 'Test 1' ? 'res-1' : 'res-2';
            const el = document.getElementById(id);
            if(success) {
                el.innerHTML = "✅ SUCCESS! File found.";
                el.className = "success";
            } else {
                el.innerHTML = "❌ FAILED! Browser cannot find file.<br>Path checked: " + document.querySelector(name === 'Test 1' ? 'img' : 'div:nth-of-type(2) img').src;
                el.className = "fail";
            }
        }
    </script>
</body>
</html>
