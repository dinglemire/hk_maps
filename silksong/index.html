<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silksong Interactive Map</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- 1. SIDEBAR MENU -->
    <div id="sidebar">
        <div class="sidebar-header">
            <h2>Pharloom Map</h2>
            <input type="text" id="searchBox" placeholder="Search Target..." />
        </div>

        <div class="controls">
            <button onclick="showAll()">Show All</button>
            <button onclick="hideAll()">Hide All</button>
        </div>

        <!-- Categories injected by JS -->
        <div id="filterList"></div>

        <!-- Marker Size Slider -->
        <div class="slider-container">
            <label>Marker Size</label>
            <input type="range" min="16" max="64" value="32" id="iconSizeSlider">
        </div>

        <!-- DEV TOOLS (Hidden by default in CSS, toggle to use) -->
        <div id="devTools">
            <h3>🛠️ Admin Mode</h3>
            <label><input type="checkbox" id="editModeToggle"> Enable Click-to-Place</label>
            <select id="markerTypeSelector"></select>
            <textarea id="exportArea" placeholder="JSON will appear here..."></textarea>
            <button onclick="copyJSON()">Copy JSON</button>
        </div>
    </div>

    <!-- 2. THE MAP -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Our Data -->
    <script src="data.js"></script>
    <!-- Main Logic -->
    <script src="script.js"></script>
</body>
</html>
