<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silksong Interactive Map</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- TOGGLE SIDEBAR BUTTON -->
    <button id="sidebarToggle" onclick="toggleSidebar()">☰</button>

    <!-- SIDEBAR MENU -->
    <div id="sidebar">
        <div class="sidebar-header">
            <div class="header-top">
                <h2>Pharloom Map</h2>
                <button class="close-btn" onclick="toggleSidebar()">×</button>
            </div>
            <input type="text" id="searchBox" placeholder="Search Target..." onkeyup="searchFilter()" />
        </div>

        <!-- Global Buttons -->
        <div class="controls">
            <button class="btn-control" onclick="showAll()">Show All</button>
            <button class="btn-control" onclick="hideAll()">Hide All</button>
            <button class="btn-control" onclick="resetProgress()">Reset Pins</button>
        </div>

        <!-- Filter List -->
        <div id="filterList"></div>

        <!-- Settings -->
        <div class="slider-container">
            <label>Marker Size</label>
            <input type="range" min="20" max="64" value="32" id="iconSizeSlider">
        </div>

        <!-- ADMIN TOOLS (Hidden by Default) -->
        <div id="devTools" style="display: none;">
            <h3>🛠️ Admin Mode</h3>
            <label class="toggle-label">
                <input type="checkbox" id="editModeToggle"> Enable Click-to-Place
            </label>
            <select id="markerTypeSelector"></select>
            <textarea id="exportArea" placeholder="JSON will appear here..."></textarea>
            <button class="btn-control" onclick="copyJSON()">Copy JSON</button>
        </div>

        <!-- FOOTER / ADMIN TOGGLE -->
        <div class="sidebar-footer">
            <span onclick="toggleAdminPanel()" title="Toggle Admin Mode">Admin Mode</span>
        </div>
    </div>

    <!-- MAP CONTAINER -->
    <div id="map"></div>

    <!-- SCRIPTS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
